name: AutoClipFactory
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: autoclipfactory
  cancel-in-progress: false
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run clipping factory
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python autoclip/factory.py
      - name: Save rendered clips as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoclipfactory-output
          path: output/
          if-no-files-found: ignore
          retention-days: 3
      - name: Save rendered clips as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoclipfactory-output
          path: output/
          if-no-files-found: ignore
          retention-days: 3
      - name: Commit processed-video ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed.json || true
          git diff --cached --quiet || git commit -m "Update processed video ledger"
          git push
